name: smart-campaign-composer

# Works without a .env file (K27). Compose reads .env for ${VAR} interpolation on its own, so a value set there
# (the API key, a tuned rate) wins; otherwise the default after ":-" applies. Keep these defaults identical to
# .env.example. `environment` beats `env_file`, which is optional and only carries extra keys such as APP_DEBUG.
x-env: &env
  APP_NAME: ${APP_NAME:-Smart Campaign Composer}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-campaign}
  DB_USERNAME: ${DB_USERNAME:-campaign}
  DB_PASSWORD: ${DB_PASSWORD:-campaign}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: ${SESSION_DRIVER:-array}
  LLM_DRIVER: ${LLM_DRIVER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
  PROVIDER_URL: ${PROVIDER_URL:-http://mock-provider:8080}
  SEND_RATE_PER_SECOND: ${SEND_RATE_PER_SECOND:-100}
  WORKERS_PER_CHANNEL: ${WORKERS_PER_CHANNEL:-8}
  MOCK_LATENCY_MIN_MS: ${MOCK_LATENCY_MIN_MS:-10}
  MOCK_LATENCY_MAX_MS: ${MOCK_LATENCY_MAX_MS:-80}
  MOCK_RATE_500: ${MOCK_RATE_500:-0.05}
  MOCK_RATE_429: ${MOCK_RATE_429:-0.02}
  MOCK_RATE_TIMEOUT: ${MOCK_RATE_TIMEOUT:-0.01}
  MOCK_RATE_ACCEPT_THEN_500: ${MOCK_RATE_ACCEPT_THEN_500:-0.02}

x-backend: &backend
  image: smart-campaign-backend:dev
  env_file:
    - path: .env
      required: false
  environment: *env
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-campaign}
      POSTGRES_USER: ${DB_USERNAME:-campaign}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campaign}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for the real SMS/email provider; the service name is what PROVIDER_URL expects.
  mock-provider:
    build:
      context: .
      dockerfile: mock-provider/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web role: migrates and seeds on start, then serves the API.
  app:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Fails on any non-2xx, so a down database or Redis (503) marks the app unhealthy.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Same image as app, one queue per channel. Started after app so migrations are done.
  worker-sms:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=sms", "--sleep=0", "--max-time=3600"]
    stop_grace_period: 60s
    deploy:
      replicas: ${WORKERS_PER_CHANNEL:-8}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The entrypoint execs the worker, so it is PID 1 while it is alive.
      test: ["CMD-SHELL", "grep -q queue:work /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker-email:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=email", "--sleep=0", "--max-time=3600"]
    stop_grace_period: 60s
    deploy:
      replicas: ${WORKERS_PER_CHANNEL:-8}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q queue:work /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Takes StartCampaignJob (the default queue): freezes the audience and queues the send jobs. One is enough,
  # because it only moves ids; the channel workers do the slow part.
  worker-campaign:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=0", "--max-time=3600"]
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q queue:work /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
